<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3E5F71">
<title>Sign in · StatsPack Tech Sales Agent Portal</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="form" autocomplete="on">
    <div class="brand">
      <img src="/logo.png" alt="" onerror="this.remove();document.getElementById('hat').classList.remove('hidden')">
      <span class="hat hidden" id="hat"></span>
      <span>StatsPack<small>Tech Sales Agent Portal</small></span>
    </div>
    <h1 class="login-title">Sign in</h1>
    <p class="login-sub">Agents and administrators use the same door.</p>

    <div class="field">
      <label for="email">Email address</label>
      <input class="pill" id="email" type="email" name="email" required autocomplete="username"
             placeholder="you@statspack.co.ls">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input class="pill" id="password" type="password" name="password" required
             autocomplete="current-password" placeholder="Your password">
      <button class="eye" id="eye" type="button" aria-label="Show password" title="Show password">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <p id="err" class="hidden" style="background:#FBE4DE;color:#A8412A;padding:10px 13px;border-radius:9px;
       font-size:13.5px;margin-bottom:12px"></p>

    <button class="btn-primary" id="go" type="submit">Sign in</button>
    <p class="login-foot">Trouble signing in? Ask your StatsPack administrator to reset your password.</p>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);
const eye = $('eye'), pw = $('password'), icon = $('eyeIcon');
eye.onclick = () => {
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  eye.title = show ? 'Hide password' : 'Show password';
  icon.innerHTML = show
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  pw.focus();
};

if (localStorage.getItem('sp_token')) location.replace('/');

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('go'), err = $('err');
  err.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: $('email').value.trim(), password: pw.value})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Sign-in failed.');
    localStorage.setItem('sp_token', d.token);
    localStorage.setItem('sp_user', JSON.stringify(d.user));
    location.replace('/');
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign in';
    pw.select();
  }
});
</script>
</body>
</html>
